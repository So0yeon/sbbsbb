<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지도 모드 v2 — 시대별 영토</title>
<link rel="stylesheet" href="vendor/font/pretendard.css">
<link rel="stylesheet" href="css/map2.css">
</head>
<body>

<header class="top">
  <div class="era-block">
    <h1 class="era-name" id="eraName">삼국시대</h1>
    <span class="era-years" id="eraYears"></span>
    <span class="era-span" id="eraSpan"></span>
  </div>
  <span class="cent" id="centLabel" hidden></span>
  <button class="ghost" id="replay" type="button">다시 재생</button>
  <div class="legend" id="legend"></div>
</header>

<main class="stage">
  <svg id="mapSvg" role="img" aria-label="시대별 영토 지도"></svg>
</main>

<nav class="bottom">
  <div id="dots"></div>
  <div id="track"></div>
</nav>

<!-- 기존 파일 — 읽기만 합니다 (고치지 않습니다) -->
<script src="js/atlas-geo.js"></script>
<script src="js/map-data.js"></script>

<!-- v2 -->
<script src="js/map2/territory-data.js"></script>
<script src="js/map2/tide.js"></script>
<script src="js/map2/map2-app.js"></script>

</body>
</html>
