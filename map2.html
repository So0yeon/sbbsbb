<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지도 모드 v2 — 시대별 영토</title>
<link rel="stylesheet" href="vendor/font/pretendard.css">
<link rel="stylesheet" href="css/map2.css">
</head>
<body>

<header class="top">
  <div class="era-block">
    <h1 class="era-name" id="eraName">삼국시대</h1>
    <span class="era-years" id="eraYears"></span>
    <span class="era-span" id="eraSpan"></span>
  </div>
  <span class="cent" id="centLabel" hidden></span>
  <button class="ghost" id="replay" type="button" title="고조선부터 조선까지 죽 봅니다">처음부터</button>
  <button class="ghost" id="pause" type="button">멈춤</button>
  <button class="ghost" id="motion" type="button">모핑 끄기</button>
  <div class="legend" id="legend"></div>
</header>

<main class="stage">
  <div class="map-wrap">
    <svg id="mapSvg" role="img" aria-label="시대별 영토 지도"></svg>
    <div class="map-filter"><div class="cat-filter" id="catFilter"></div></div>
    <div class="zoomers">
      <button class="icon-btn" id="zoomIn" type="button" aria-label="확대" title="확대">＋</button>
      <button class="icon-btn" id="zoomOut" type="button" aria-label="축소" title="축소">－</button>
      <button class="icon-btn" id="zoomFit" type="button" aria-label="시대 전체 보기" title="시대 전체 보기">⤢</button>
    </div>
  </div>

  <aside class="map-side">
    <p class="era-line" id="eraLine"></p>
    <div class="list-head">이 시대의 이야기 <span id="itemCount"></span></div>
    <div class="item-list" id="itemList"></div>
  </aside>
</main>

<nav class="bottom">
  <div id="dots"></div>
  <div id="track"></div>
</nav>

<div id="mapScrim"></div>
<div id="mapSheet" role="dialog" aria-modal="true" aria-label="항목 상세">
  <button class="icon-btn sheet-x" id="sheetClose" type="button" aria-label="닫기">✕</button>
  <div class="map-card" id="mapCard"></div>
</div>

<!-- 기존 파일 — 읽기만 합니다 (고치지 않습니다) -->
<script src="js/atlas-geo.js"></script>
<script src="js/map-data.js"></script>
<script src="js/atlas-content.js"></script>
<script src="js/atlas-photos.js"></script>
<script src="js/asset-credits.js"></script>
<script src="js/atlas-dedupe.js"></script>
<script src="js/store.js"></script>

<!-- v2 -->
<script src="js/map2/territory-data.js"></script>
<script src="js/map2/morph.js"></script>
<script src="js/map2/panel.js"></script>
<script src="js/map2/map2-app.js"></script>

</body>
</html>
