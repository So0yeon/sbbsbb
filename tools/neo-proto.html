<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신석기 브릭 미리보기</title>
<!--
  개발용 확인 화면 — 앱 전체를 띄우지 않고 움집 하나만 크게 본다.
  전체 세계를 띄우면 헤드리스에서 몇 분씩 걸려 손볼 때마다 기다려야 한다.
  ?what=hut|village|kiln|shrine|pots|weave|tools|shell   ?yaw=  ?dist=
-->
<script type="importmap">
{ "imports": {
    "three": "../vendor/three/build/three.module.js",
    "three/addons/": "../vendor/three/addons/"
} }
</script>
<style>
  html, body { margin:0; height:100%; background:#DDD8C8; }
  canvas { display:block; }
  #tag { position:fixed; left:12px; top:10px; font:14px/1.5 system-ui, sans-serif;
         color:#4A4636; background:#F2EEE0; padding:6px 12px; border-radius:8px; }
</style>
</head>
<body>
<div id="tag">…</div>
<script type="module">
import * as THREE from 'three';
import { ST } from '../js/engine/state.js';
import { preloadBricks, flushBricks, BRICK_H } from '../js/engine/bricks.js';
import * as N from '../js/engine/props-neolithic.js';

const qp = new URLSearchParams(location.search);
const WHAT = qp.get('what') || 'hut';

/* 소품들이 ST 를 읽으므로 최소한만 채워 준다 */
ST.BOUND = 20;
ST.WORLD_ID = 'neolithic';
ST.currentArea = 'proto';
ST.QUESTS = []; ST.NPCS = [];
ST.spawnPos = { x: 0, z: 40 };
ST.propSpots = [];

const scene = new THREE.Scene();
scene.background = new THREE.Color('#C9D8E2');
scene.add(new THREE.HemisphereLight('#FFFFFF', '#B9AE92', 1.5));
const sun = new THREE.DirectionalLight('#FFF6E0', 1.5);
sun.position.set(6, 12, 8);
scene.add(sun);

/* 바닥 */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 120),
  new THREE.MeshStandardMaterial({ color: '#CFC6A8', flatShading: true, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
scene.add(ground);

/* 키 견줌 막대 — 캐릭터 키 2 */
const ref = new THREE.Mesh(
  new THREE.BoxGeometry(.35, 2, .35),
  new THREE.MeshStandardMaterial({ color: '#7E9E74', flatShading: true })
);
ref.position.set(4.2, 1, 3.2);
scene.add(ref);

const yaw  = parseFloat(qp.get('yaw') || 0.9);

const BUILD = {
  hut:     () => N.pitHouse(0, 0, { face: Math.atan2(Math.cos(yaw), Math.sin(yaw)) }),
  village: () => N.villageNeo(),
  kiln:    () => N.kilnNeo(),
  shrine:  () => N.shrineNeo(),
  pots:    () => N.pottersSpotNeo(),
  weave:   () => N.weavingNeo(),
  tools:   () => N.toolWorkshopNeo(),
  shell:   () => N.shellMound(),
  farm:    () => { const r = N.farmFieldNeo(); N.fieldFenceNeo(); return r; },
  canoe:   () => N.canoeNeo()
};

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);

const dist = parseFloat(qp.get('dist') || (WHAT === 'village' ? 26 : 11));
const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, .1, 300);
camera.position.set(Math.sin(yaw) * dist, dist * .42, Math.cos(yaw) * dist);
camera.lookAt(0, WHAT === 'village' ? 2 : 1.8, 0);

preloadBricks().then(() => {
  // 소품이 스스로 자리를 고르므로, 만든 뒤에 그 자리를 본다
  const spot = (BUILD[WHAT] || BUILD.hut)() || { x: 0, z: 0 };
  ref.position.set(spot.x + 4.2, 1, spot.z + 3.2);
  camera.position.set(spot.x + Math.sin(yaw) * dist, dist * .42, spot.z + Math.cos(yaw) * dist);
  camera.lookAt(spot.x, WHAT === 'village' ? 2 : 1.6, spot.z);
  const g = flushBricks(scene);
  const n = g ? (g.userData.count || 0) : 0;
  const calls = g ? g.children.length : 0;
  document.getElementById('tag').textContent =
    WHAT + ' — 브릭 ' + n + '조각 · 드로우콜 ' + calls + ' · 왼쪽 초록 막대는 캐릭터 키 2';
  renderer.render(scene, camera);
  console.log('[NEOPROTO] ' + JSON.stringify({ what: WHAT, 조각: n, 드로우콜: calls }));
});
</script>
</body>
</html>
