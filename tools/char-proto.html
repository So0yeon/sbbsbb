<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>캐릭터 비교 — 두루 vs Kenney 미니 캐릭터</title>
<link rel="stylesheet" href="../vendor/font/pretendard.css">
<style>
  body{ margin:0; font-family:'Pretendard Variable',Pretendard,sans-serif; background:#E9E4D3; }
  #c{ display:block; width:100vw; height:100vh; }
  .hud{ position:fixed; left:0; right:0; top:0; display:flex; }
  .hud div{ flex:1; text-align:center; padding:12px; font-size:14px; font-weight:700; color:#3A3126; }
  .hud small{ display:block; font-weight:500; font-size:11.5px; color:#6E6A5E; margin-top:2px; }
  #stat{ position:fixed; left:12px; bottom:12px; font-size:12px; color:#4A463C;
         background:rgba(255,255,255,.85); padding:8px 12px; border-radius:10px; white-space:pre; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div>지금의 두루<small>절차적 · 두루미</small></div>
  <div>Kenney 원본<small>현대 복장 그대로</small></div>
  <div>몸통만 물들임<small>한복 저고리 느낌</small></div>
  <div>브릭 한복 덧입힘<small>저고리·바지·갓을 브릭으로</small></div>
</div>
<div id="stat">불러오는 중…</div>

<script type="importmap">
{ "imports": { "three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/addons/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#E4E1CB');
const camera = new THREE.PerspectiveCamera(38, 1, .1, 200);
camera.position.set(0, 2.4, 9.5);
camera.lookAt(0, 1.1, 0);

scene.add(new THREE.HemisphereLight('#EAF2EF', '#B9A98A', 1.15));
const sun = new THREE.DirectionalLight('#FFF3DD', 1.3); sun.position.set(14, 26, 12); scene.add(sun);
const fill = new THREE.DirectionalLight('#CFE3FF', .5); fill.position.set(-12, 14, -8); scene.add(fill);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color:'#E9E4D3', flatShading:true }));
ground.rotation.x = -Math.PI/2; scene.add(ground);

const matCache = new Map();
const mat = c => { if (!matCache.has(c)) matCache.set(c, new THREE.MeshStandardMaterial({ color:c, flatShading:true, roughness:.93 })); return matCache.get(c); };
const box = (w,h,d,c,x,y,z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(c)); m.position.set(x,y,z); return m; };
const cyl = (rt,rb,h,s,c,x,y,z) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s), mat(c)); m.position.set(x,y,z); return m; };

/* ── 1) 지금의 두루 ─────────────────────────────────────────── */
function duru(x){
  const o = new THREE.Group();
  o.add(cyl(.34,.42,1.05,9,'#F4F1E6',0,1.02,0));
  const armGeo = new THREE.BoxGeometry(.16,.74,.34);
  const la = new THREE.Mesh(armGeo, mat('#D8D2C0')); la.position.set(-.46,1.16,0); o.add(la);
  const ra = la.clone(); ra.position.set(.46,1.16,0); o.add(ra);
  const head = new THREE.Group(); head.position.set(0,1.58,0); o.add(head);
  head.add(cyl(.13,.17,.42,8,'#F4F1E6',0,.1,0));
  const sk = new THREE.Mesh(new THREE.IcosahedronGeometry(.3,0), mat('#F4F1E6')); sk.position.y=.5; head.add(sk);
  const beak = new THREE.Mesh(new THREE.ConeGeometry(.1,.46,5), mat('#E0A64B'));
  beak.rotation.x = Math.PI/2; beak.position.set(0,.48,.34); head.add(beak);
  const f = new THREE.Mesh(new THREE.ConeGeometry(.075,.62,5), mat('#C25B4F'));
  f.geometry.translate(0,.31,0); f.position.set(0,.70,-.06); f.rotation.z=-.16; head.add(f);
  const eg = new THREE.SphereGeometry(.052,6,5);
  [-.16,.16].forEach(ex => { const e = new THREE.Mesh(eg, mat('#2B2620')); e.position.set(ex,.56,.21); head.add(e); });
  o.add(cyl(.075,.075,.58,6,'#6E6A5E',-.16,.29,0));
  o.add(cyl(.075,.075,.58,6,'#6E6A5E', .16,.29,0));
  const strap = new THREE.Mesh(new THREE.TorusGeometry(.36,.045,5,12), mat('#8A6E52'));
  strap.rotation.set(Math.PI/2,0,.5); strap.position.y=1.16; o.add(strap);
  o.add(box(.34,.3,.2,'#9C7A54',.38,.82,-.12));
  o.add(box(.22,.28,.07,'#C25B4F',-.4,.86,-.1));
  o.position.set(x,0,0); o.rotation.y = Math.PI;
  scene.add(o);
  return o;
}

/* ── Kenney 미니 캐릭터 ─────────────────────────────────────── */
const loader = new GLTFLoader();
const mixers = [];

const BRICK = {};
async function loadBrick(n){
  const g = await loader.loadAsync('../assets/kenney/bricks/' + n + '.glb');
  let geo = null; g.scene.traverse(o => { if (o.isMesh && !geo) geo = o.geometry; });
  geo = geo.clone();
  const K = 0.28 / 0.079;
  geo.scale(K,K,K); geo.computeBoundingBox();
  const b = geo.boundingBox;
  geo.translate(-(b.min.x+b.max.x)/2, -b.min.y, -(b.min.z+b.max.z)/2);
  geo.computeVertexNormals();
  BRICK[n] = geo;
}
const brickMesh = (n, c) => new THREE.Mesh(BRICK[n], mat(c));

const FILE = { raw:'character-male-a', tint:'character-male-b', hanbok:'character-male-c' };
async function kenney(x, mode){
  console.log('[P] kenney 시작 ' + mode);
  const g = await loader.loadAsync('../assets/kenney/characters/' + FILE[mode] + '.glb');
  console.log('[P] glb 도착 ' + mode);
  const root = g.scene;

  root.traverse(o => {
    if (!o.isMesh) return;
    const isHead = /head/i.test(o.name);
    let color = '#FFFFFF';
    if (mode === 'tint' && !isHead) color = '#DCD3BE';
    if (mode === 'hanbok' && !isHead) color = '#E8E2D0';
    o.material = new THREE.MeshStandardMaterial({
      map: o.material.map || null, color, flatShading: true, roughness: .95, metalness: 0
    });
  });

  console.log('[P] 재질 완료');
  const b3 = new THREE.Box3().setFromObject(root);
  console.log('[P] bbox 완료');
  const s = 2.0 / (b3.max.y - b3.min.y);
  root.scale.setScalar(s);
  root.position.set(x, 0, 0);

  const torso = root.getObjectByName('torso') || root;
  const head = root.getObjectByName('head') || root;

  /* 가방 · 수첩 — 몸통 뼈에 붙여 애니메이션을 따라가게 */
  const kit = new THREE.Group();
  const bag = box(.30,.26,.16,'#9C7A54', .30,-.02,-.12);
  const strap = new THREE.Mesh(new THREE.TorusGeometry(.30,.035,5,12), mat('#8A6E52'));
  strap.rotation.set(Math.PI/2,0,.5); strap.position.set(0,.06,0);
  const bookie = box(.18,.24,.06,'#C25B4F', -.30,0,-.10);
  kit.add(bag, strap, bookie);
  torso.add(kit);

  /* 한복 덧입히기 — 브릭으로 저고리·바지·갓 */
  if (mode === 'hanbok'){
    const coat = brickMesh('none-hq-plate-2x4', '#EDE7D6');
    coat.scale.set(.34,.9,.36); coat.position.set(0,-.30,0); coat.rotation.y = Math.PI/2;
    torso.add(coat);
    const belt = brickMesh('none-hq-plate-2x4', '#8A7B4E');
    belt.scale.set(.36,.5,.38); belt.position.set(0,-.34,0); belt.rotation.y = Math.PI/2;
    torso.add(belt);
    const gat = new THREE.Group();
    const brim = new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.05,12), mat('#3E3A34'));
    const crown = new THREE.Mesh(new THREE.CylinderGeometry(.20,.22,.30,10), mat('#3E3A34'));
    crown.position.y = .17; gat.add(brim, crown);
    gat.position.set(0, .46, 0);
    head.add(gat);
  }

  console.log('[P] 부착 완료');
  const mixer = new THREE.AnimationMixer(root);
  const clip = THREE.AnimationClip.findByName(g.animations, 'idle') || g.animations[0];
  mixer.clipAction(clip).play();
  mixers.push(mixer);
  scene.add(root);
  return g.animations.length;
}

(async () => {
  console.log('[P] 시작');
  await Promise.all(['none-hq-plate-2x4'].map(loadBrick));
  console.log('[P] 브릭 완료');
  duru(-3.6);
  console.log('[P] 두루 완료');
  const n = await kenney(-1.2, 'raw');
  console.log('[P] raw 완료');
  await kenney(1.2, 'tint');
  console.log('[P] tint 완료');
  await kenney(3.6, 'hanbok');
  console.log('[P] hanbok 완료');
  document.getElementById('stat').textContent =
    `Kenney 미니 캐릭터 · 애니메이션 ${n}종 (idle walk sprint jump emote-yes emote-no pick-up interact …)\n` +
    `가방·수첩은 torso 뼈에 붙여 애니메이션을 따라 움직입니다`;

  renderer.render(scene, camera);   // 가상 시간에서는 rAF 가 안 돌 수 있어 한 번 즉시 그린다
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const d = clock.getDelta();
    mixers.forEach(m => m.update(d));
    renderer.render(scene, camera);
  });
})().catch(e => { document.getElementById('stat').textContent = '오류: ' + e.message; console.error(e); });

function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
</script>
</body>
</html>
